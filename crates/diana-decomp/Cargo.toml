[package]
name = "diana-decomp"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
description = "Diana native DEX decompiler (development scaffold; not implemented)"
license = "Apache-2.0"
publish = false
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }

[dependencies]
fastrace = { version = "0.7", optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-general-category = "1"

[features]
perf = ["dep:fastrace", "fastrace/enable"]
# Prints one line per display pass that changed something for a method. Off by
# default: an ordinary build logs nothing and writes nothing to stderr.
trace-passes = []
