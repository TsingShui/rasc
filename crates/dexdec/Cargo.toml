[package]
name = "dexdec"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "DEX to Java decompiler used by rasc's `getclass`"
keywords = ["android", "dex", "decompiler", "reverse-engineering"]
categories = ["development-tools"]
readme = "README.md"

# Derived from asLody/dexdec (Apache-2.0; see LICENSE). This tree is maintained
# in-tree: it has no CLI, no archive entry point, no platform-symbol database and
# no Kotlin backend, and `[lib] test = false` keeps its legacy unit tests out of
# the workspace gate.
[dependencies]
rusty-dex = { path = "../rusty-dex", version = "1.0.0" }
bitflags = "2"
rayon = "1"

[features]
default = []

[lib]
test = false

# The pipeline still carries inherited style that has not been adopted into the
# workspace lint policy. Drop this allowance once that cleanup happens.
[lints.rust]
warnings = "allow"
