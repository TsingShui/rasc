[package]
name = "rusty-dex"
version = "1.0.1"
edition = "2024"
license = "Apache-2.0"
description = "DEX parser used by the in-tree `dexdec` decompiler"
readme = "README.md"

# The zip-based APK reader is behind the `apk` feature: rasc and dexdec consume
# DEX bytes, not archives, so the default build avoids native compression backends.
[dependencies]
byteorder = "1.4.3"
zip = { version = "0.6.4", optional = true, default-features = false, features = ["deflate-zlib", "bzip2", "zstd"] }
log = "0.4.21"
thiserror = "2.0.12"

[features]
default = []
apk = ["dep:zip"]

# Derived from rusty-rs/rusty-dex 0.2.0 plus asLody/dexdec's extensions
# (Apache-2.0; see LICENSE). The parser keeps its inherited style for now.
[lints.rust]
warnings = "allow"
