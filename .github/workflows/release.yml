name: Release

# A manual release synchronizes the workspace versions on main, builds that
# exact commit, and publishes only after all builds succeed. Release notes are
# read from docs/releases/<tag>.md rather than generated from commit history.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (X.Y.Z, without the v prefix)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run the release workflow on the main branch." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release preparation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Prepare version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash tools/release/prepare.sh

  build:
    name: ${{ matrix.platform }} ${{ matrix.target }}
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-14
            target: aarch64-apple-darwin
            binary: rasc
          - platform: macOS
            runner: macos-14
            target: x86_64-apple-darwin
            binary: rasc
          - platform: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: rasc
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rasc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Tests (host target only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --quiet --locked

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BIN=target/${{ matrix.target }}/release/${{ matrix.binary }}
          ACTUAL_VERSION="$("$BIN" --version)"
          echo "$ACTUAL_VERSION"
          test "$ACTUAL_VERSION" = "rasc $VERSION"
          "$BIN" --help > /dev/null

      - name: Package (macOS and Linux)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NAME="rasc-${VERSION}-${{ matrix.target }}"
          mkdir -p "$NAME"
          cp "target/${{ matrix.target }}/release/rasc" "$NAME/"
          cp LICENSE NOTICE README.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          rm -rf "$NAME"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Name = "rasc-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $Name
          Copy-Item LICENSE, NOTICE, README.md $Name
          Compress-Archive -Path $Name -DestinationPath "$Name.zip"
          $Hash = (Get-FileHash "$Name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$Name.zip.sha256", "$Hash  ${Name}.zip`n", [System.Text.UTF8Encoding]::new($false))
          Remove-Item -Recurse -Force $Name

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            rasc-*.tar.gz
            rasc-*.tar.gz.sha256
            rasc-*.zip
            rasc-*.zip.sha256

  release:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Tag ${RELEASE_TAG} points to a different commit." >&2
              exit 1
            fi
          else
            # If another process created the tag, this push fails rather than replacing it.
            git push origin "HEAD:refs/tags/${RELEASE_TAG}"
          fi

          if RELEASE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft 2>&1)"; then
            if [ "$RELEASE_STATE" != true ]; then
              echo "Release ${RELEASE_TAG} is already published; refusing to modify it." >&2
              exit 1
            fi
          elif [[ "$RELEASE_STATE" == *"(HTTP 404)"* ]]; then
            NOTES="docs/releases/${RELEASE_TAG}.md"
            if [ -f "$NOTES" ]; then
              NOTES_ARGS=(--notes-file "$NOTES")
            else
              NOTES_ARGS=(--notes "macOS (aarch64 + x86_64), Linux x86_64 musl, and Windows x86_64 artefacts.")
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "rasc ${RELEASE_TAG}" "${NOTES_ARGS[@]}"
          else
            echo "Could not check release ${RELEASE_TAG}: ${RELEASE_STATE}" >&2
            exit 1
          fi

          # Keep the release in draft until every asset has been uploaded. Clobber
          # supports retrying a partially uploaded draft after a failed run.
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
