name: Diana

# Diana-only gates: format, lint and release build.
# `gates` runs the declared minimum toolchain (1.93) on three platforms; `latest`
# reruns the same gates on current stable so new lints and warnings surface before
# a toolchain bump. No version preparation, artifact upload, tag or release.

on:
  push:
    paths:
      - "apps/diana/**"
      - "crates/diana-decomp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/diana.yml"
  pull_request:
    paths:
      - "apps/diana/**"
      - "crates/diana-decomp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/diana.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: diana-gates-${{ matrix.runner }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --release

  latest:
    name: Gates (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: diana-latest

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --locked --release
