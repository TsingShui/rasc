[package]
name = "diana"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
description = "Native Diana APK/DEX analysis and decompilation CLI"
license = "Apache-2.0"
publish = false
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
diana-decomp = { path = "../../crates/diana-decomp" }
fastrace = { version = "0.7", optional = true }
libdeflater = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[features]
perf = ["dep:fastrace", "fastrace/enable", "diana-decomp/perf"]

[[example]]
name = "app_profile"
required-features = ["perf"]
